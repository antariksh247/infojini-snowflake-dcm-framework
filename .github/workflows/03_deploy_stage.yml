name: "03 Deploy STAGE"

# Merge to main = deploy to STAGE: DCM first, then dbt (dbt depends on DCM objects).
on:
  push:
    branches: ["main"]
    paths: ["manifest.yml", "sources/**", "dbt/**", "apps/**"]
  workflow_dispatch:
    inputs:
      allow_drops:
        description: "Allow DROP of database/schema/table/stage (only after reviewing the plan)"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: deploy-stage
  cancel-in-progress: false

env:
  SNOWFLAKE_ACCOUNT: HBISGZI-VK71809
  SNOWFLAKE_USER: INFOJINI_STAGE_CI_SVC
  SNOWFLAKE_ROLE: INFOJINI_STAGE_DEPLOYER
  SNOWFLAKE_WAREHOUSE: INFOJINI_ADMIN_WH

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: INFOJINI_STAGE
    steps:
      - uses: actions/checkout@v5
      - uses: snowflakedb/snowflake-actions/dcm/plan@v3
        with:
          target: INFOJINI_STAGE
          project-path: ./
          snowflake-user: INFOJINI_STAGE_CI_SVC
      - uses: snowflakedb/snowflake-actions/dcm/deploy@v3
        with:
          target: INFOJINI_STAGE
          project-path: ./
          snowflake-user: INFOJINI_STAGE_CI_SVC
          allow-drops: ${{ inputs.allow_drops == true && 'true' || 'false' }}   # push = always false

      # dbt always after DCM (same job: one approval for PROD)
      - uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true
      - name: dbt deploy + build (STAGE)
        run: snow sql -x -f pipeline/dbt_deploy.sql -D "env=STAGE" -D "target=stage" -D "git_ref=branches/main"

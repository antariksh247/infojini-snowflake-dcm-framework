name: "04 Deploy PROD"

# Release tag (v1.0.0, v1.1.0 ...) = deploy that exact version to PROD.
# The GitHub Environment INFOJINI_PROD has a required reviewer: the job waits for approval.
on:
  push:
    tags: ["v*"]
  # Manual re-run of a release with drops allowed: "Use workflow from" = the release TAG
  # (the INFOJINI_PROD environment rejects anything that is not a v* tag).
  workflow_dispatch:
    inputs:
      allow_drops:
        description: "Allow DROP of database/schema/table/stage (only after reviewing the plan)"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  SNOWFLAKE_ACCOUNT: HBISGZI-VK71809
  SNOWFLAKE_USER: INFOJINI_PROD_CI_SVC
  SNOWFLAKE_ROLE: INFOJINI_PROD_DEPLOYER
  SNOWFLAKE_WAREHOUSE: INFOJINI_ADMIN_WH

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: INFOJINI_PROD
    steps:
      - uses: actions/checkout@v5
      - uses: snowflakedb/snowflake-actions/dcm/plan@v3
        with:
          target: INFOJINI_PROD
          project-path: ./
          snowflake-user: INFOJINI_PROD_CI_SVC
      - uses: snowflakedb/snowflake-actions/dcm/deploy@v3
        with:
          target: INFOJINI_PROD
          project-path: ./
          snowflake-user: INFOJINI_PROD_CI_SVC
          allow-drops: ${{ inputs.allow_drops == true && 'true' || 'false' }}   # push = always false

      # dbt always after DCM (same job: one approval for PROD)
      - uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true
      - name: dbt deploy + build (PROD, from the tag)
        run: snow sql -x -f scripts/ci/dbt_deploy.sql -D "env=PROD" -D "target=prod" -D "git_ref=tags/${{ github.ref_name }}"

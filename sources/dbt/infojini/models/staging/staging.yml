version: 2

models:
  - name: stg_customers
    columns:
      - name: CUSTOMER_ID
        tests: [unique, not_null]
  - name: stg_orders
    columns:
      - name: ORDER_ID
        tests: [unique, not_null]
      - name: STATUS
        tests:
          - accepted_values:
              values: ['COMPLETED', 'CANCELLED', 'PENDING']
  - name: stg_products
    columns:
      - name: PRODUCT_ID
        tests: [unique, not_null]

# =====================================================================
# DCM project manifest
#   targets     : the environments DCM deploys (via GitHub Actions only)
#   assets      : non-SQL files shipped with the project (Streamlit code)
#   templating  : the ONLY place where environments differ
#
# DEV is not here on purpose: DEV is the developers' free playground
# (objects created by hand, dbt run with --target dev). See DEVELOPER_GUIDE.md.
# Target names = GitHub Environment names.
# =====================================================================
manifest_version: 2
type: DCM_PROJECT

default_target: INFOJINI_STAGE

targets:
  INFOJINI_STAGE:
    account_identifier: HBISGZI-VK71809
    project_name: INFOJINI_ADMIN_DB.PROJECTS.INFOJINI_STAGE
    project_owner: INFOJINI_STAGE_DEPLOYER
    templating_config: STAGE

  INFOJINI_PROD:
    account_identifier: HBISGZI-VK71809
    project_name: INFOJINI_ADMIN_DB.PROJECTS.INFOJINI_PROD
    project_owner: INFOJINI_PROD_DEPLOYER
    templating_config: PROD

# Asset files are NOT Jinja-templated: app code must be environment-agnostic.
# One asset per Streamlit app: name = lower-case app name, path = apps/<APP>/
assets:
  str_customer_app:
    path: 'apps/STR_CUSTOMER_APP/**/*'

templating:
  defaults:
    project: INFOJINI
    bronze_db: INFOJINI_BRONZE_DB          # shared Bronze, same in every env
    wh_size: XSMALL
    auto_suspend: 60
    retention_days: 1
    task_state: SUSPENDED                  # tasks exist but don't run on their own
    task_schedule: "USING CRON 0 2 * * * Asia/Kolkata"
    # Who gets which access role (functional roles come from platform/01_platform.sql)
    silver_write: []
    silver_read:  []
    gold_write:   []
    gold_read:    []
    app_users:    []                       # Streamlit users (app views + procs only)

  configurations:
    STAGE:
      env: STAGE
      app_users:    [INFOJINI_APP_USER]
      silver_read:  [INFOJINI_DATA_ENGINEER, INFOJINI_DATA_SCIENTIST]
      gold_read:    [INFOJINI_DATA_ENGINEER, INFOJINI_DATA_SCIENTIST, INFOJINI_ANALYST]

    PROD:
      env: PROD
      task_state: STARTED                  # only PROD runs on schedule
      retention_days: 7
      app_users:    [INFOJINI_APP_USER]
      silver_read:  [INFOJINI_DATA_ENGINEER, INFOJINI_DATA_SCIENTIST]
      gold_read:    [INFOJINI_DATA_ENGINEER, INFOJINI_DATA_SCIENTIST, INFOJINI_ANALYST, INFOJINI_BI_SERVICE]

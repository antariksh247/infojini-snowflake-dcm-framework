# DCM project manifest: one codebase, three targets (DEV / STAGE / PROD).
# Target names = GitHub Environment names (used by the workflows in step 7).
manifest_version: 2
type: DCM_PROJECT

default_target: INFOJINI_DEV

targets:
  INFOJINI_DEV:
    account_identifier: HBISGZI-VK71809
    project_name: INFOJINI_ADMIN_DB.PROJECTS.INFOJINI_DEV
    project_owner: INFOJINI_DEV_DEPLOYER
    templating_config: DEV

  INFOJINI_STAGE:
    account_identifier: HBISGZI-VK71809
    project_name: INFOJINI_ADMIN_DB.PROJECTS.INFOJINI_STAGE
    project_owner: INFOJINI_STAGE_DEPLOYER
    templating_config: STAGE

  INFOJINI_PROD:
    account_identifier: HBISGZI-VK71809
    project_name: INFOJINI_ADMIN_DB.PROJECTS.INFOJINI_PROD
    project_owner: INFOJINI_PROD_DEPLOYER
    templating_config: PROD

# Non-SQL files shipped with the project (not Jinja-templated; code must be env-agnostic)
assets:
  customer_app:
    path: 'assets/streamlit/**/*'

templating:
  defaults:
    project: INFOJINI
    bronze_db: INFOJINI_BRONZE_DB          # shared, same in every env
    wh_size: XSMALL
    auto_suspend: 60
    retention_days: 1
    task_state: SUSPENDED                  # DEV / STAGE: tasks exist but never run on their own (EXECUTE TASK to test)
    task_schedule: "USING CRON 0 2 * * * Asia/Kolkata"
    # functional roles per access level (account roles come from setup/01_platform.sql)
    silver_write: []
    silver_read:  []
    gold_write:   []
    gold_read:    []
    app_users:    []                       # roles that use the app (view + proc only)

  configurations:
    DEV:
      env: DEV
      silver_write: [INFOJINI_DATA_ENGINEER]
      gold_write:   [INFOJINI_DATA_ENGINEER]
      silver_read:  [INFOJINI_DATA_SCIENTIST]
      gold_read:    [INFOJINI_DATA_SCIENTIST]

    STAGE:
      env: STAGE
      app_users:    [INFOJINI_APP_USER]
      silver_read:  [INFOJINI_DATA_ENGINEER, INFOJINI_DATA_SCIENTIST]
      gold_read:    [INFOJINI_DATA_ENGINEER, INFOJINI_DATA_SCIENTIST, INFOJINI_ANALYST]

    PROD:
      env: PROD
      task_state: STARTED                  # only PROD runs on schedule
      app_users:    [INFOJINI_APP_USER]
      retention_days: 7
      silver_read:  [INFOJINI_DATA_ENGINEER, INFOJINI_DATA_SCIENTIST]
      gold_read:    [INFOJINI_DATA_ENGINEER, INFOJINI_DATA_SCIENTIST, INFOJINI_ANALYST, INFOJINI_BI_SERVICE]
